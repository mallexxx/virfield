<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Virfield v2</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main><header><div><p class="eyebrow">LOCAL VM CONTROL</p><h1>Virfield <small>v2</small></h1></div><span id="connection" role="status">Disconnected</span></header>
<section id="login"><h2>Connect to the manager</h2><form id="connect"><label>API token<input id="token" type="password" autocomplete="off" required minlength="32"></label><button>Connect</button></form><p>Token stays in this page’s memory. Reloading disconnects.</p></section>
<div id="console" hidden><section><p class="eyebrow">CAPACITY</p><h2 id="capacity">Checking slots…</h2><p id="blockers"></p><p id="backend" role="status"></p></section>
<section><h2>Prepare an isolated VM</h2><form id="acquire"><label>Golden image<select id="template" required></select></label><label>Lease duration<select id="ttl"><option value="3600">1 hour</option><option value="14400">4 hours</option><option value="86400">24 hours</option></select></label><button id="prepare">Prepare VM</button></form><p>Each lease reserves one slot. At most two VMs may run at once.</p></section>
<section><h2>Golden images</h2><div id="images"></div></section><section><h2>Jobs</h2><div id="jobs"></div></section><section><h2>Active leases</h2><div id="leases"></div></section><section><h2>Recent events</h2><ol id="events"></ol></section></div><p id="error" role="alert"></p></main></body></html>
