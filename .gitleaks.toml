[extend]
useDefault = true

[[rules]]
id = "apple-developer-session"
description = "Apple Developer session cookie (Netscape, Cookie header or JSON)"
regex = '''(?i)(?:ADCDownloadAuth|myacinfo)(?:[ \t]+|["']?\s*[:=]\s*["']?)([A-Za-z0-9%+_./:=~-]{20,})'''
secretGroup = 1
keywords = ["adcdownloadauth", "myacinfo"]
